[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmath-harness"
version = "0.1.0"
description = "Harness vs bare open LLM on ETH D-MATH exams"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/dmath_harness"]

[tool.pytest.ini_options]
markers = [
    "docker: tests that require the dmath-python-sandbox Docker image",
]
